services:
  postgres:
    image: postgres:16
    container_name: billwise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: billwise
      POSTGRES_PASSWORD: billwise
      POSTGRES_DB: billwise
    ports:
      - "5432:5432"
    volumes:
      - billwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billwise -d billwise"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  billwise_pgdata:
