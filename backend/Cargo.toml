[package]
name = "billwise"
version = "0.1.0"
edition = "2021"
description = "BillWise backend — Bill of Quantities API"
license = "UNLICENSED"
publish = false

[dependencies]
axum            = "0.7"
tokio           = { version = "1", features = ["full"] }
tower-http      = { version = "0.5", features = ["trace", "cors"] }

sqlx            = { version = "0.8", default-features = false, features = [
                      "runtime-tokio", "tls-rustls", "postgres",
                      "macros", "migrate",
                      "uuid", "time", "bigdecimal",
                  ] }
bigdecimal      = { version = "0.4", features = ["serde"] }

serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
uuid            = { version = "1", features = ["v4", "serde"] }
time            = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }

argon2          = "0.5"
password-hash   = { version = "0.5", features = ["std"] }
jsonwebtoken    = "9"

thiserror       = "1"
anyhow          = "1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy         = "0.15"

[dev-dependencies]
# domain unit tests are #[cfg(test)] in-file; no extra deps needed yet.

[profile.dev]
# Faster incremental compiles during slice 1.
opt-level = 0
debug = 1
